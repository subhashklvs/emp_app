{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 rounded-4 mt-4">
            <div class="card-body p-4 p-md-5">
                <h3 class="card-title text-center mb-4 fw-bold text-dark">Welcome Back</h3>
                
                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label visually-hidden">Username</label>
                        <input type="text" id="username" name="username" class="form-control form-control-lg" placeholder="Username" required>
                    </div>
                    
                    <div class="mb-2">
                        <label for="password" class="form-label visually-hidden">Password</label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Password" required>
                    </div>
                    
                    <div class="mb-4 text-center">
                        <a href="/forgot" class="text-primary text-decoration-none small fw-semibold">Forgot Password?</a>
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-semibold">Sign In</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-semibold">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
