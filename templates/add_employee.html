{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0 mt-4">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4 fw-bold text-primary">Add Employee</h3>
                
                <form method="post">
                    <div class="mb-3">
                        <label for="ename" class="form-label">Name</label>
                        <input type="text" id="ename" name="ename" class="form-control" placeholder="Enter full name" required>
                    </div>
                    <div class="mb-3">
                        <label for="edept" class="form-label">Department</label>
                        <input type="text" id="edept" name="edept" class="form-control" placeholder="Enter department" required>
                    </div>
                    <div class="mb-3">
                        <label for="esalary" class="form-label">Salary</label>
                        <input type="number" id="esalary" name="esalary" class="form-control" placeholder="Enter salary amount" required>
                    </div>
                    <div class="mb-4">
                        <label for="ephone" class="form-label">Phone</label>
                        <input type="text" id="ephone" name="ephone" class="form-control" placeholder="Enter phone number" required>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg">Add Employee</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
