{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                <h3 class="card-title text-center mb-4 fw-bold text-dark">Reset Password</h3>
                
                <form method="POST">
                    <div class="mb-3">
                        <label for="password" class="form-label visually-hidden">New Password</label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" placeholder="Enter new password" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirm_password" class="form-label visually-hidden">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control form-control-lg" placeholder="Confirm password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-semibold">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
