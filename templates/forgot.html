{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow border-0 rounded-4 mt-4">
            <div class="card-body p-4 p-md-5">
                <h3 class="card-title text-center mb-4 fw-bold text-dark">Forgot Password</h3>
                <p class="text-center text-muted mb-4">Enter your username or email and we'll send you a link to reset your password.</p>
                
                <form method="POST">
                    <div class="mb-4">
                        <label for="email" class="form-label visually-hidden">Email or Username</label>
                        <input type="text" id="email" name="email" class="form-control form-control-lg" placeholder="Enter your username or email" required>
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-semibold">Send Reset Link</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <a href="/" class="text-primary text-decoration-none small fw-semibold">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
